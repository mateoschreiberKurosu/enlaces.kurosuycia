{% if website.adx_partialurl %}{% assign site_root = website.adx_partialurl | prepend: '/' %}{% else %}{% assign site_root = '' %}{% endif %}
<section class="ks-page" aria-labelledby="not-found-title">
  <div class="ks-page__container">
    <section class="ks-page__empty" aria-labelledby="not-found-title">
      <span class="ks-page__eyebrow">Error 404</span>
      <h1 id="not-found-title">No encontramos esta página</h1>
      <p>Puede que el enlace haya cambiado o ya no esté disponible.</p>
      <div class="ks-page__button-row"><a class="ks-page__button" href="{% if site_root %}{{ site_root }}{% else %}/{% endif %}">Ir al inicio</a><a class="ks-page__button" href="{{ site_root }}/contacto/">Contacto</a></div>
    </section>
  </div>
</section>
